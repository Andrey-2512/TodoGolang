hash:
  memory: 65536
  time: 3
  threads: 1
  key_len: 32
  salt_length: 16

http:
  addr: "0.0.0.0:8000"
  allow_credentials: true
  allow_methods:
    - "GET"
    - "POST"
    - "PATCH"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Authorization"
    - "Content-Type"
  access_control_max_age: 3800
  idle_timeout: "60s"
  read_timeout: "20s"
  write_timeout: "30s"
  handler_timeout: "5s"

jwt:
  access_ttl: "30m"
  refresh_ttl: "168h"
  whitelist_prefix: "wl:"

database:
  max_idle_conns: 100
  max_open_conns: 100
  max_conn_lifetime: "1h"
  conn_timeout: "10s"

redis:
  min_idle_conns: 100
  pool_size: 100
  read_timeout: "500ms"
  write_timeout: "500ms"
  conn_max_lifetime: "1h"
  conn_timeout: "10s"

cache:
  cache_task_ttl: "30m"
  tasks_cache_prefix: "tasks:"
  user_tasks_cache_prefix: "user:"

app:
  max_tasks_per_user: 500
