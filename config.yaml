hash:
  memory: 65536
  time: 3
  threads: 1
  key_len: 32
  salt_length: 16

http:
  addr: "0.0.0.0:8000"
  cors_url:
  - "*"
  idle_timeout: "60s"
  read_timeout: "20s"
  write_timeout: "30s"

jwt:
  access_ttl: "30m"
  refresh_ttl: "168h"
  blacklist_prefix: "bl:"

database:
  host: "localhost"
  port: 5432
  name: "go_todo_db"
  max_idle_conns: 100
  max_open_conns: 100
  max_conn_lifetime: "1h"
  conn_timeout: "30s"

redis:
  addr: "localhost:6379"
  db: 0
  min_idle_conns: 100
  pool_size: 100
  read_timeout: "500ms"
  write_timeout: "500ms"
  conn_max_lifetime: "1h"

cache:
  cache_task_ttl: "30m"
  tasks_cache_prefix: "tasks:"
  user_tasks_cache_prefix: "user:"


